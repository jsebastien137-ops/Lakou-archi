<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paramètres — Lakou Achitekti</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<link href="/styles.css" rel="stylesheet"/>
</head>
<body>
<div id="shell-slot"></div>

<div class="page" id="page-settings">
  <div class="form-page">
    <div class="form-header">
      <button class="btn-back" onclick="window.location.href='/dashboard/'">← Retour</button>
      <div class="nav-logo" style="font-size:1.05rem">Paramètres</div>
      <div style="width:24px"></div>
    </div>

    <div class="form-body">
      <div class="form-eyebrow">Mon compte</div>
      <h1 class="form-title">Paramètres</h1>

      <!-- AVATAR -->
      <div class="form-section">
        <div class="form-section-title">Photo de profil</div>
        <div class="avatar-wrap">
          <div class="profile-avatar">
            <img id="settings-avatar-img" src="" alt="" style="display:none">
            <span id="settings-avatar-letter"></span>
          </div>
          <label class="avatar-cam" for="settings-avatar-input" title="Changer la photo">📷</label>
          <input type="file" id="settings-avatar-input" accept="image/*" style="display:none" onchange="doAvatarUpload(this)">
        </div>
        <br>
        <button class="avatar-remove" id="settings-avatar-remove-btn" onclick="doAvatarRemove()">Supprimer la photo</button>
      </div>

      <!-- INFOS -->
      <div class="form-section">
        <div class="form-section-title">Informations</div>

        <div class="form-group">
          <label class="field-label">Bio</label>
          <textarea id="settings-bio-input" class="field-input" rows="3" placeholder="Parle un peu de toi..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="field-label">Classe</label>
            <select id="settings-class-input" class="field-input">
              <option value="">— Non renseignée —</option>
              <option value="L1">L1</option>
              <option value="L2">L2</option>
              <option value="L3">L3</option>
              <option value="L4">L4</option>
              <option value="L5">L5</option>
            </select>
          </div>
          <div class="form-group">
            <label class="field-label">École</label>
            <input type="text" id="settings-school-input" class="field-input" placeholder="Ex. Faculté d'Architecture">
          </div>
        </div>

        <div class="form-actions">
          <button class="form-btn" id="settings-save-btn" style="width:100%" onclick="doSaveSettingsProfile()">Enregistrer</button>
        </div>
      </div>

      <!-- MOT DE PASSE -->
      <div class="form-section">
        <div class="form-section-title">Mot de passe</div>

        <div class="form-group">
          <label class="field-label">Nouveau mot de passe</label>
          <input type="password" id="new-password" class="field-input" placeholder="Minimum 6 caractères">
        </div>
        <div class="form-group">
          <label class="field-label">Confirmer le mot de passe</label>
          <input type="password" id="confirm-password" class="field-input" placeholder="Retape le mot de passe">
        </div>

        <div class="form-actions">
          <button class="form-btn" style="width:100%" onclick="doChangePassword()">Changer le mot de passe</button>
        </div>
      </div>

    </div>
  </div>
</div>

<div id="toast"></div>
<script src="/supabase-client.js"></script>
<script src="/app.js"></script>
<script src="/settings/app.js"></script>
</body>
</html>
