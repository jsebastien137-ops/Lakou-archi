<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tous les projets — Lakou Achitekti</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<link href="../styles.css" rel="stylesheet"/>
</head>
<body>

<!-- NAV minimale -->
<nav id="nav">
  <button class="btn-back" onclick="window.location.href='../'" style="display:flex">← Retour</button>
  <div class="nav-logo">Lakou<span>.</span>Achitekti</div>
  <div style="width:24px"></div>
</nav>

<div style="padding-top:64px;min-height:100vh;background:var(--creme)">

  <!-- EN-TÊTE + FILTRES -->
  <div class="projets-header">
    <p class="section-tag">Archive publique</p>
    <h1 class="projets-title">Tous les projets</h1>
    <p class="projets-subtitle">Les projets validés par un enseignant, ouverts à tous.</p>
    <div class="filters" id="projets-filters">
      <button class="filter-btn active" onclick="filterProjects('all', this)">Tous</button>
      <button class="filter-btn" onclick="filterProjects('L1', this)">L1</button>
      <button class="filter-btn" onclick="filterProjects('L2', this)">L2</button>
      <button class="filter-btn" onclick="filterProjects('L3', this)">L3</button>
      <button class="filter-btn" onclick="filterProjects('L4', this)">L4</button>
      <button class="filter-btn" onclick="filterProjects('L5', this)">L5</button>
    </div>
  </div>

  <!-- GRILLE -->
  <div class="gallery-body">
    <div id="projets-grid" class="gallery-grid">
      <p style="color:var(--gris);font-family:sans-serif;font-size:0.85rem">Chargement...</p>
    </div>
  </div>

</div>

<!-- BOUTON FLOTTANT : déposer un projet (visible seulement pour un étudiant connecté) -->
<button class="fab-btn hidden" id="fab-new-project" onclick="openSubmitModal()" aria-label="Déposer un projet" title="Déposer un projet">+</button>

<!-- MODAL SOUMISSION — étape 1/2 (identique à /galerie/) -->
<div class="modal-overlay" id="submit-modal-overlay" onclick="if(event.target===this)closeSubmitModal()">
  <div class="modal-box">
    <button class="modal-close-btn" onclick="closeSubmitModal()" aria-label="Fermer">✕</button>
    <div class="form-eyebrow">Nouveau projet · Étape 1/2</div>
    <h2 class="form-title" style="font-size:1.5rem;margin-bottom:1.2rem">Déposer un projet</h2>

    <div class="form-group">
      <label class="field-label">Nom du projet</label>
      <input type="text" id="modal-proj-title" class="field-input" placeholder="Ex. Résidence Beaumont">
    </div>

    <div class="form-group">
      <label class="field-label">Description</label>
      <textarea id="modal-proj-desc" class="field-input" rows="3" placeholder="Décris ton projet en quelques lignes..."></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="field-label">Catégorie</label>
        <select id="modal-proj-category" class="field-input">
          <option value="">— Choisir —</option>
          <option value="ecole">École</option>
          <option value="residentiel">Résidentiel</option>
          <option value="industrie">Industrie</option>
          <option value="sante">Santé</option>
          <option value="culturel">Culturel / Public</option>
          <option value="commercial">Commercial</option>
          <option value="autre">Autre</option>
        </select>
      </div>
      <div class="form-group">
        <label class="field-label">Année</label>
        <input type="text" id="modal-proj-year" class="field-input" placeholder="Ex. 2026">
      </div>
    </div>

    <div class="form-group">
      <label class="field-label">Superficie (m²)</label>
      <input type="number" id="modal-proj-area" class="field-input" placeholder="Ex. 120">
    </div>

    <p id="submit-modal-error" class="hidden" style="color:#b91c1c;font-size:0.78rem;font-family:sans-serif;margin-bottom:0.8rem"></p>

    <div class="form-actions">
      <button class="form-btn-cancel" onclick="closeSubmitModal()">Annuler</button>
      <button class="form-btn" id="modal-submit-btn" onclick="doCreateProjectFromModal()">Créer et continuer →</button>
    </div>
    <p style="font-size:0.68rem;color:var(--gris);font-family:sans-serif;margin-top:0.8rem;text-align:center">
      La prochaine étape te permettra d'ajouter plans, coupes et façades.
    </p>
  </div>
</div>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
