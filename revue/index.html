<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revue de Lakou Achitekti</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<link href="/styles.css" rel="stylesheet"/>
<link href="/revue/styles.css" rel="stylesheet"/>
</head>
<body>

<!-- NAV minimale -->
<nav id="nav">
  <button class="btn-back" onclick="window.location.href='/'" style="display:flex">← Retour</button>
  <div class="nav-logo">Lakou<span>.</span>Achitekti</div>
  <div style="width:24px"></div>
</nav>

<div style="padding-top:64px;background:var(--creme);min-height:100vh">

  <!-- BANNIÈRE — collage animé (images tirées du bucket revue-covers) -->
  <section class="collage-section">
    <div class="stage" id="stage">

      <div class="piece" style="--x:22%;--y:30%;--w:46%;--r:-4deg">
        <img src="https://qptnjgdfobznwmsguvyf.supabase.co/storage/v1/object/public/revue-covers/boniface.jpeg" alt="Portrait — Boniface" />
      </div>
      <div class="piece" style="--x:55%;--y:22%;--w:38%;--r:3deg">
        <img src="https://qptnjgdfobznwmsguvyf.supabase.co/storage/v1/object/public/revue-covers/images%20(3).jpeg" alt="Photographie — Revue de Lakou Achitekti" />
      </div>
      <div class="piece" style="--x:78%;--y:38%;--w:34%;--r:-5deg">
        <img src="https://qptnjgdfobznwmsguvyf.supabase.co/storage/v1/object/public/revue-covers/images%20(4).jpeg" alt="Photographie — Revue de Lakou Achitekti" />
      </div>
      <div class="piece" style="--x:15%;--y:62%;--w:40%;--r:5deg">
        <img src="https://qptnjgdfobznwmsguvyf.supabase.co/storage/v1/object/public/revue-covers/images%20(5).jpeg" alt="Photographie — Revue de Lakou Achitekti" />
      </div>
      <div class="piece" style="--x:42%;--y:55%;--w:50%;--r:-2.5deg">
        <img src="https://qptnjgdfobznwmsguvyf.supabase.co/storage/v1/object/public/revue-covers/88e679c8cddb7530e6cbcb07eb147c8f.jpg" alt="Photographie — Revue de Lakou Achitekti" />
      </div>
      <div class="piece" style="--x:68%;--y:65%;--w:36%;--r:4.5deg">
        <img src="https://qptnjgdfobznwmsguvyf.supabase.co/storage/v1/object/public/revue-covers/georges).jpeg" alt="Portrait — Georges" />
      </div>
      <div class="piece" style="--x:85%;--y:75%;--w:30%;--r:-3deg">
        <img src="https://qptnjgdfobznwmsguvyf.supabase.co/storage/v1/object/public/revue-covers/images%20(7).jpeg" alt="Photographie — Revue de Lakou Achitekti" />
      </div>
      <div class="piece" style="--x:32%;--y:80%;--w:34%;--r:6deg">
        <img src="https://qptnjgdfobznwmsguvyf.supabase.co/storage/v1/object/public/revue-covers/images%20(6).jpeg" alt="Photographie — Revue de Lakou Achitekti" />
      </div>

      <div class="voile"></div>

      <div class="infos">
        <span class="kicker">Espace éditorial — La Revue</span>
        <span class="item i1">Bâtiment de la semaine</span>
        <span class="item i2">Kisa ou wè</span>
        <span class="item i3">Lekòl Achitekti</span>
        <span class="item i4">Articles</span>
        <span class="rule"></span>
        <span class="credit">Une initiative de May-Hélène FÉLIX</span>
      </div>

    </div>
  </section>

  <!-- RECHERCHE + FILTRES -->
  <div class="revue-toolbar">
    <input type="text" id="revue-search" class="revue-search" placeholder="Rechercher un titre..." oninput="onRevueSearchInput()">
    <div class="revue-categories" id="revue-categories">
      <button class="revue-cat-pill active" data-slug="" onclick="setRevueCategory('', this)">Tout</button>
    </div>
    <div id="revue-admin-bar" class="hidden" style="margin-bottom:1.2rem">
      <button class="form-btn" onclick="window.location.href='/revue/admin.html'">+ Nouvelle publication</button>
    </div>
  </div>

  <!-- GRILLE -->
  <div class="revue-body">
    <div id="revue-grid" class="revue-grid">
      <p style="color:var(--gris);font-family:sans-serif;font-size:0.85rem">Chargement...</p>
    </div>
    <div class="revue-load-more hidden" id="revue-load-more-wrap">
      <button class="form-btn-cancel" id="revue-load-more-btn" onclick="loadRevuePosts(false)">Charger plus</button>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
(function(){
  var stage  = document.getElementById('stage');
  var pieces = stage.querySelectorAll('.piece');
  var timers = [];
  var PAS = 1150;    // délai entre chaque découpage qui apparaît
  var FLOU = 1600;   // pause après la dernière image avant le flou (marge large)
  var LECTURE = 5000; // temps de lecture des infos — ~5 secondes

  function clear(){ timers.forEach(clearTimeout); timers = []; }
  function at(ms, fn){ timers.push(setTimeout(fn, ms)); }

  function jouer(){
    clear();
    stage.classList.remove('flou','texte');
    pieces.forEach(function(p){ p.classList.remove('in'); });

    at(300, function(){
      pieces.forEach(function(p,i){ at(i*PAS, function(){ p.classList.add('in'); }); });
    });

    var finReveal = 300 + (pieces.length - 1) * PAS + 1500;
    var finFlouStart = finReveal + FLOU;
    at(finFlouStart, function(){ stage.classList.add('flou'); });
    at(finFlouStart + 450, function(){ stage.classList.add('texte'); });
    at(finFlouStart + 450 + LECTURE, function(){
      stage.classList.remove('texte');
      at(900, function(){ stage.classList.remove('flou'); });
      at(1800, jouer);
    });
  }

  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){ if(e.isIntersecting){ jouer(); io.disconnect(); } });
  },{threshold:.35});
  io.observe(stage);
})();
</script>
<script src="/supabase-client.js"></script>
<script src="app.js"></script>
</body>
</html>
